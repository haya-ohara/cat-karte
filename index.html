<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>猫の健康相談AI</title>
</head>
<body>
    <h1>🐱 猫の健康相談チャット</h1>
    <div id="chat-box" style="border: 1px solid #ccc; padding: 10px; height: 200px; overflow-y: scroll; margin-bottom: 10px;"></div>
    
    <input type="text" id="user-input" placeholder="症状を入力してください..." style="width: 70%;">
    <button onclick="sendMessage()">送信</button>

    <script>
        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const chatBox = document.getElementById('chat-box');
            const text = inputField.value;
            if (!text) return;

            // ユーザーの発言を表示
            chatBox.innerHTML += `<p><b>あなた:</b> ${text}</p>`;
            inputField.value = '';

            try {
                // FastAPI（バックエンド）へPOSTリクエストを送信
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });

                const data = await response.json();
                
                // AIからの返答を表示
                chatBox.innerHTML += `<p><b>AI:</b> ${data.reply}</p>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (error) {
                chatBox.innerHTML += `<p style="color: red;">エラーが発生しました。</p>`;
            }
        }
    </script>
</body>
</html>
