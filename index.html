<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ねこカルテ</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/index.css">

    <!-- フォント読み込み -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic&display=swap" rel="stylesheet">
</head>
<body>
    <!-- ヘッダー -->
    <header>
        <a href="index.html" class="header-logo">
            <img src="img/shared/アイコン.png" alt="ねこカルテ">
        </a>

        <div class="header-nav-container">
            <nav>
                <ul>
                    <li><a href="disease_list.html">病気一覧</a></li>
                    <li><a href="contact.html">お問い合わせ</a></li>
                </ul>
            </nav>
            <img src="img/shared/ネコ線.png" alt="" class="nav-cat-img">
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="main-content">
        
        <!-- ファーストビュー（大きな猫の写真とタイトル） -->
        <section class="hero-section">
            <div class="hero-inner">
                <p class="hero-subtitle">ネコの気になるお悩みを気軽に相談！</p>
                <h1 class="hero-title"><span style="color: #af5a22;;">ねこ</span>カルテ</h1>
            </div>
        </section>

        <!-- メッセージセクション（左に丸い写真、右に文章） -->
        <section class="message-section">
            <div class="message-container">
                <div class="message-img-box">
                    <img src="./img/index/section-image.jpeg" alt="本を読む猫">
                </div>
                <div class="message-text-box">
                    <p>ねこちゃんの体調が悪いと心配になりますよね<br>
                    そんな時は迷わずご相談下さい<br>
                    我々が力になります</p>
                    <p class="ai-note-title">AIのご使用は</p>
                    <p class="ai-note-main">1日3件まで無料で可能です</p>
                    <p class="ai-note-sub">※感染症や怪我などについてはAIではなく獣医師の受診を申し上げます</p>
                </div>
            </div>
        </section>

        <!-- 肉球とAIに相談するセクション -->
        <section class="consult-section">
            <div class="consult-bg-paw">
                <div class="consult-content">
                    <!-- 周りの小さな写真たち -->
                    <img src="./img/index/cat-image1.jpg" alt="" class="floating-photo photo-1">
                    <img src="./img/index/cat-image2.jpg" alt="" class="floating-photo photo-2">
                    <img src="./img/index/cat-image3.jpg" alt="" class="floating-photo photo-3">
                    
                    <h2 class="consult-heading">AIに相談する</h2>
                    
                    <!-- 中央の猫イラスト -->
                    <div class="consult-cat-center">
                        <img src="./img/index/cat_AIChat.png " alt="お座り猫">
                    </div>

                    <!-- 相談してみるボタン -->
                    <div class="consult-btn-wrapper">
                        <a href="chat.html" class="consult-btn">相談してみる　→</a>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- コンテンツ -->

    <!-- フッター -->
    <footer>
        <div id="social-icons">
            <a href="#"><img src="img/shared/twitter-icon.png" alt="Twitter"></a>
            <a href="#"><img src="img/shared/instagram-icon.png" alt="Instagram"></a>
            <a href="#"><img src="img/shared/youtube-icon.png" alt="YouTube"></a>
            <a href="#"><img src="img/shared/facebook-icon.png" alt="Facebook"></a>
            <a href="#"><img src="img/shared/tiktok-icon.png" alt="TikTok"></a>
        </div>
        <!-- リンクメニュー部分にクラスを付与 -->
        <div class="footer-links">
            <a href="disease_list.html">病気一覧</a>
            <a href="contact.html">お問い合わせ</a>
            <a href="#">利用規約</a>
        </div>
        <p class="copyright">&copy;okaki. All Rights Reserved</p>
    </footer>
</body>
</html>
