<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ねこカルテ - お問い合わせ</title>
    <link rel="stylesheet" href="css/contact_finished.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="img/shared/favicon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <a href="index.html" class="header-logo">
            <img src="img/shared/アイコン.png" alt="ねこカルテ">
        </a>

        <div class="header-nav-container">
            <nav>
                <ul>
                    <li><a href="disease_list.html">病気一覧</a></li>
                    <li><a href="contact.html">お問い合わせ</a></li>
                </ul>
            </nav>
            <img src="img/shared/ネコ線.png" alt="" class="nav-cat-img">
        </div>
    </header>

    <!-- <main> -->
        <div class="contact-wrapper">
            <h1 class="main-title">お問い合わせ承りました！</h1>
            <p class="sub-title sub-text">ご送信いただいたメールアドレス宛にご回答させていただきます。</p>
            
            <div class="result-container">
                <h2 class="result-title">お問い合わせ内容</h2>

                <dl class="result-list">
                    <div class="result-item">
                        <dt>お名前</dt>
                        <dd>{{ name }}</dd>
                    </div>

                    <div class="result-item">
                        <dt>メールアドレス</dt>
                        <dd>{{ email }}</dd>
                    </div>

                    <div class="result-item">
                        <dt>お問い合わせ内容</dt>
                        <dd>{{ message }}</dd>
                    </div>
                </dl>
            </div>
        </div>

        <div class="btn-container">
            <a href="index.html" class="submit-btn home-btn">トップページへ戻る</a>
        </div>
    <!-- </main> -->

     <footer>
        <div id="social-icons">
            <a href="#"><img src="img/shared/twitter-icon.png" alt="Twitter"></a>
            <a href="#"><img src="img/shared/instagram-icon.png" alt="Instagram"></a>
            <a href="#"><img src="img/shared/youtube-icon.png" alt="YouTube"></a>
            <a href="#"><img src="img/shared/facebook-icon.png" alt="Facebook"></a>
            <a href="#"><img src="img/shared/tiktok-icon.png" alt="TikTok"></a>
        </div>
        <!-- リンクメニュー部分にクラスを付与 -->
        <div class="footer-links">
            <a href="disease_list.html">病気一覧</a>
            <a href="contact.html">お問い合わせ</a>
            <a href="#">利用規約</a>
        </div>
        <p class="copyright">&copy;okaki. All Rights Reserved</p>
    </footer>
    </body>
</html>
