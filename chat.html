<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fff4e2">
    <title>猫の健康相談AI</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/chat.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- ヘッダー -->
    <header>
        <a href="index.html" class="header-logo">
            <img src="img/shared/アイコン.png" alt="ねこカルテ">
        </a>

        <div class="header-nav-container">
            <nav>
                <ul>
                    <li><a href="disease_list.html">病気一覧</a></li>
                    <li><a href="contact.html">お問い合わせ</a></li>
                </ul>
            </nav>
            <img src="img/shared/ネコ線.png" alt="" class="nav-cat-img">
        </div>
    </header>

    <main class="chat-page">
        <nav class="progress" aria-label="診断の進行状況">
            <div class="progress__line" aria-hidden="true"></div>
            <div class="progress__step is-current" data-step="1">
                <span class="progress__dot"></span>
                <span class="progress__label">診断内容の把握</span>
            </div>
            <div class="progress__step" data-step="2">
                <span class="progress__dot"></span>
                <span class="progress__label">詳しくご相談</span>
            </div>
            <div class="progress__step" data-step="3">
                <span class="progress__dot"></span>
                <span class="progress__label">結果</span>
            </div>
        </nav>

        <section id="chat-box" class="chat-box" aria-live="polite" aria-label="チャット">
            <div class="message message--ai">今日はどうされましたか？</div>
        </section>

        <section class="chat-controls" aria-label="メッセージ入力">
            <div id="options-container" class="options-container">
                <button class="option-btn" type="button" data-option="食欲がない">↳ 食欲がない</button>
                <button class="option-btn" type="button" data-option="元気がない">↳ 元気がない</button>
            </div>

            <form id="chat-form" class="chat-form">
                <label class="visually-hidden" for="user-input">相談内容</label>
                <input
                    type="text"
                    id="user-input"
                    name="message"
                    placeholder="お気軽にご相談ください"
                    autocomplete="off"
                    maxlength="500"
                    required
                >
                <button class="send-btn" type="submit" aria-label="送信">
                    <!-- <span aria-hidden="true">🐾</span> -->
                    <img src="img/chat/chat-send-icon.png">
                </button>
            </form>
            <p class="chat-note">これはあくまでAIによる判断です。断定できるものではありません。</p>
        </section>
    </main>

    <script src="js/chat.js" defer></script>
</body>
</html>
