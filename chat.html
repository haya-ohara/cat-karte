<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fff4e2">
    <title>猫の健康相談AI</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/chat.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- ヘッダー -->
    <header>
        <a href="index.html" class="header-logo">
            <img src="img/shared/アイコン.png" alt="ねこカルテ">
        </a>

        <div class="header-nav-container">
            <nav>
                <ul>
                    <li><a href="disease_list.html">病気一覧</a></li>
                    <li><a href="contact.html">お問い合わせ</a></li>
                </ul>
            </nav>
            <img src="img/shared/ネコ線.png" alt="" class="nav-cat-img">
        </div>
    </header>

    <!-- ================================= -->
    <!-- 事前情報フォーム -->
    <!-- ================================= -->
    <main class="chat-page">
        <section id="profile-panel" class="profile-panel">

            <h2>猫ちゃんの基本情報</h2>

            <p class="profile-description">
                まずは猫ちゃんについて教えてください。
                回答をもとに健康相談を進めます。
            </p>

            <form id="profile-form" class="profile-form">

                <!-- 年齢 -->
                <div class="profile-field">

                    <label for="cat-age">年齢</label>

                    <input
                        type="text"
                        id="cat-age"
                        name="age"
                        placeholder="例：3歳、生後6か月"
                        required
                        maxlength="30"
                    >

                </div>


                <!-- 猫種 -->
                <div class="profile-field">

                    <label for="cat-breed">猫種</label>

                    <input
                        type="text"
                        id="cat-breed"
                        name="breed"
                        placeholder="例：雑種、スコティッシュフォールド"
                        required
                        maxlength="50"
                    >

                </div>


                <!-- 元気の有無 -->
                <div class="profile-field">

                    <label for="cat-energy">元気はありますか？</label>

                    <select id="cat-energy" name="energy" required>

                        <option value="">選択してください</option>

                        <option value="いつも通り元気がある">
                            いつも通り元気がある
                        </option>

                        <option value="いつもより元気がない">
                            いつもより元気がない
                        </option>

                        <option value="ぐったりしている">
                            ぐったりしている
                        </option>

                        <option value="判断できない">
                            判断できない
                        </option>

                    </select>

                </div>


                <!-- 食欲の有無 -->
                <div class="profile-field">

                    <label for="cat-appetite">食欲はありますか？</label>

                    <select id="cat-appetite" name="appetite" required>

                        <option value="">選択してください</option>

                        <option value="いつも通り食べている">
                            いつも通り食べている
                        </option>

                        <option value="少し食欲が落ちている">
                            少し食欲が落ちている
                        </option>

                        <option value="ほとんど食べない">
                            ほとんど食べない
                        </option>

                        <option value="全く食べない">
                            全く食べない
                        </option>

                        <option value="判断できない">
                            判断できない
                        </option>

                    </select>

                </div>


                <button type="submit" class="profile-submit">
                    回答して健康相談を始める
                </button>

            </form>

        </section>



        <!-- ================================= -->
        <!-- チャット履歴 -->
        <!-- ================================= -->

        <div id="chat-box" class="chat-box" hidden>
        </div>

    </main>


<!-- ================================= -->
<!-- チャット入力エリア -->
<!-- ================================= -->

<div class="chat-controls" hidden>

    <div id="options-container" class="options-container">
    </div>

    <form id="chat-form" class="chat-form">

        <input
            type="text"
            id="user-input"
            placeholder="症状を入力してください..."
        >

        <button type="submit" class="send-btn">
            <img src="img/chat/chat-send-icon.png">
        </button>

    </form>

    <p class="chat-note">
        ※ AIによる回答は参考情報です。症状によっては早めに動物病院を受診してください。
    </p>

</div>

</body>
